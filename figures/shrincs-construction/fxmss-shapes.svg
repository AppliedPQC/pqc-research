" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="970" y="398" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">ctr 7</text><text x="830" y="148" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">sf_root</text><text x="830" y="428" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle" letter-spacing="0">every leaf sits at depth 3, so every signature is 580 B</text><rect x="60" y="504" width="980" height="128" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="90" y="530" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Configuration</text><text x="320" y="530" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Signature size</text><text x="500" y="530" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Budget</text><text x="650" y="530" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Key generation</text><text x="860" y="530" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Average signing</text><line x1="70" y1="540" x2="1030" y2="522" stroke="#ccc" stroke-width="1" stroke-linecap="round"/><text x="90" y="560" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">UXMSS  d = 255</text><text x="320" y="560" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">548 → 4,619 B</text><text x="500" y="560" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">256</text><text x="650" y="560" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">425,982</text><text x="860" y="560" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">133,326</text><text x="90" y="578" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">BXMSS  d = 5</text><text x="320" y="578" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">612 B</text><text x="500" y="578" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">32</text><text x="650" y="578" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">309,054</text><text x="860" y="578" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">16,522</text><text x="90" y="596" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">BXMSS  d = 8</text><text x="320" y="596" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">660 B</text><text x="500" y="596" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">256</text><text x="650" y="596" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">425,982</text><text x="860" y="596" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">133,447</text><text x="90" y="614" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">BXMSS  d = 20</text><text x="320" y="614" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">854 B</text><text x="500" y="614" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">2²⁰</text><text x="650" y="614" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">547,649,022</text><text x="860" y="614" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">547,356,475</text><text x="90" y="644" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#666" text-anchor="start" letter-spacing="0">Key generation and signing are counted in SHA-256 compressions.</text><rect x="60" y="664" width="980" height="44" rx="8" fill="#e6e0f8" stroke="#7e57c2" stroke-width="1.3"/><text x="550" y="691" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Shape does not change the cost at a given budget, only the size curve: UXMSS front-loads the small signatures, BXMSS flattens them.</text></svg>