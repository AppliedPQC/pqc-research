<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1100" height="720" fill="#ffffff"/><text x="550" y="34" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">The two prescribed FXMSS shapes</text><text x="550" y="56" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">the signer picks the shape; the budget and the size curve follow from it</text><text x="255" y="104" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">UXMSS  ·  shape = 0  ·  depth = 4</text><text x="255" y="124" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">left-leaning; budget depth + 1 = 5</text><line x1="300" y1="164" x2="240" y2="232" stroke="#888" stroke-width="1.2" stroke-linecap="round"/><line x1="300" y1="164" x2="360" y2="232" stroke="#888" stroke-width="1.2" stroke-linecap="round"/><line x1="240" y1="232" x2="180" y2="300" stroke="#888" stroke-width="1.2" stroke-linecap="round"/><line x1="240" y1="232" x2="300" y2="300" stroke="#888" stroke-width="1.2" stroke-linecap="round"/><line x1="180" y1="300" x2="120" y2="368" stroke="#888" stroke-width="1.2" stroke-linecap="round"/><line x1="180" y1="300" x2="240" y2="368" stroke="#888" stroke-width="1.2" stroke-linecap="round"/><line x1="120" y1="368" x2="84" y2="436" stroke="#888" stroke-width="1.2" stroke-linecap="round"/><li