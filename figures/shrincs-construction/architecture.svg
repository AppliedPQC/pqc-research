<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="960" viewBox="0 0 1160 960"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1160" height="960" fill="#ffffff"/><text x="580" y="34" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">How a SHRINCS signature is composed</text><text x="580" y="56" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">the stateful path on the left, the stateless fallback on the right</text><rect x="330" y="78" width="500" height="54" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="580.0" y="102.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Public key  ·  48 bytes</text><text x="580.0" y="119.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">pk_seed ‖ sl_root ‖ sf_root</text><line x1="330" y1="190" x2="330" y2="132" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="840" y1="190" x2="840" y2="132" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="130.0" y="190" width="400" height="50" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="330.0" y="212.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">sf_root</text><text x="330.0" y="229.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">root of the FXMSS tree, height 255</text><rect x="130.0" y="268" width="400" height="56" rx="6" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="330.0" y="293.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">FXMSS authentication path</text><text x="330.0" y="310.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">16 B × depth  ·  one sibling per level</text><line x1="330" y1="268" x2="330" y2="240" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="130.0" y="352" width="400" height="56" rx="6" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="330.0" y="377.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">WOTS+C signature</text><text x="330.0" y="394.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">32 chains × 16 B  =  512 B</text><line x1="330" y1="352" x2="330" y2="324" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="130.0" y="436" width="400" height="62" rx="6" fill="#fce5cd" stroke="#e69138" stroke-width="1.3"/><text x="330.0" y="464.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Constant-sum grinding</text><text x="330.0" y="481.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">counter i until Σ dᵢ = 240  ·  2 B</text><line x1="330" y1="436" x2="330" y2="408" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="130.0" y="566" width="400" height="62" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="330.0" y="594.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">digest_sf = H_msg_sf(R, pk_seed, sf_root, ADRS, M)</text><text x="330.0" y="611.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">M = 0x00 ‖ len(ctx) ‖ ctx ‖ sl_root ‖ message</text><line x1="330" y1="566" x2="330" y2="498" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="130.0" y="664" width="400" height="48" rx="6" fill="#efefef" stroke="#8a8a8a" stroke-width="1.3"/><text x="330.0" y="692.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">R = PRF_msg_sf(sk_prf, opt_rand, M)</text><line x1="330" y1="664" x2="330" y2="628" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640.0" y="190" width="400" height="50" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="840.0" y="212.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">sl_root</text><text x="840.0" y="229.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">root of the top XMSS tree</text><rect x="640.0" y="268" width="400" height="56" rx="6" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="840.0" y="293.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Hypertree  ·  d = 5 XMSS layers</text><text x="840.0" y="310.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">5 × 704 B  =  3,520 B</text><line x1="840" y1="268" x2="840" y2="240" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640.0" y="352" width="400" height="56" rx="6" fill="#f4cccc" stroke="#cc4125" stroke-width="1.3"/><text x="840.0" y="377.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">FORS public key</text><text x="840.0" y="394.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">k = 10 roots compressed by T_k</text><line x1="840" y1="352" x2="840" y2="324" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640.0" y="436" width="400" height="62" rx="6" fill="#f4cccc" stroke="#cc4125" stroke-width="1.3"/><text x="840.0" y="464.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">FORS signature</text><text x="840.0" y="481.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">k = 10 trees of height a = 13  =  2,240 B</text><line x1="840" y1="436" x2="840" y2="408" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640.0" y="514" width="400" height="44" rx="6" fill="#fce5cd" stroke="#e69138" stroke-width="1.3"/><text x="840.0" y="533.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">digest splits</text><text x="840.0" y="550.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">FORS leaf indexes | tree index | leaf index</text><line x1="840" y1="514" x2="840" y2="498" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640.0" y="566" width="400" height="62" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="840.0" y="594.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">digest_sl = H_msg_sl(R, pk_seed, sl_root, M)</text><text x="840.0" y="611.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">M = 0x00 ‖ len(ctx) ‖ ctx ‖ sf_root ‖ message</text><line x1="840" y1="566" x2="840" y2="558" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640.0" y="664" width="400" height="48" rx="6" fill="#efefef" stroke="#8a8a8a" stroke-width="1.3"/><text x="840.0" y="692.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">R = PRF_msg_sl(sk_prf, opt_rand, M)</text><line x1="840" y1="664" x2="840" y2="628" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M 530.0 586 C 500 586 640 586 640.0 586" fill="none" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/><path d="M 640.0 622 C 640 622 500 622 530.0 622" fill="none" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="585" y="608" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#cc0000" text-anchor="middle" letter-spacing="0">cross-binding</text><rect x="435" y="756" width="300" height="46" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="585.0" y="783.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Message M</text><line x1="330" y1="745" x2="330" y2="712" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="330" y1="779" x2="330" y2="745" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><line x1="840" y1="745" x2="840" y2="712" stroke="#555" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="840" y1="779" x2="840" y2="745" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><line x1="330" y1="779" x2="435" y2="779" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><line x1="735" y1="779" x2="840" y2="779" stroke="#555" stroke-width="1.2" stroke-linecap="round"/><path d="M 104 190 q 13 0 13 18.0 L 117 290.0 q 0 9 7.8 9 q -7.8 0 -7.8 9 L 117 390.0 q 0 18.0 -13 18.0" fill="none" stroke="#666" stroke-width="1.4"/><text x="92" y="292" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="end" letter-spacing="0">stateful</text><text x="92" y="310" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="end" letter-spacing="0">signature</text><path d="M 1056 190 q -13 0 -13 18.0 L 1043 290.0 q 0 9 -7.8 9 q 7.8 0 7.8 9 L 1043 390.0 q 0 18.0 13 18.0" fill="none" stroke="#666" stroke-width="1.4"/><text x="1068" y="292" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">stateless</text><text x="1068" y="310" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">fallback</text><path d="M 104 436 q 13 0 13 18.0 L 117 565.0 q 0 9 7.8 9 q -7.8 0 -7.8 9 L 117 694.0 q 0 18.0 -13 18.0" fill="none" stroke="#666" stroke-width="1.4"/><text x="92" y="570" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="end" letter-spacing="0">message</text><text x="92" y="588" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="end" letter-spacing="0">digest</text><rect x="80" y="830" width="1000" height="104" rx="8" fill="#e6e0f8" stroke="#7e57c2" stroke-width="1.3"/><text x="100" y="856" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Either path verifies against the same 48-byte public key.</text><text x="100" y="880" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">The first signature byte selects which: 255 is the stateless path, anything below it is the leaf height of a</text><text x="100" y="902" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">stateful signature. Depth 0 cannot sign, which is what frees 255 as the tag. Each digest takes its own root</text><text x="100" y="924" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">as a parameter and carries the other path's root inside M, so neither component can be used on its own.</text></svg>