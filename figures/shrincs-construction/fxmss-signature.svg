<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="880" viewBox="0 0 1020 880"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1020" height="880" fill="#ffffff"/><text x="510" y="34" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">FXMSS signature and verification  (UXMSS, depth = 4, state counter = 2)</text><rect x="30" y="52" width="392" height="96" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><line x1="48" y1="76" x2="86" y2="76" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><text x="96" y="80" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">signing path: the leaf up to the root</text><circle cx="67" cy="102" r="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="96" y="106" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">authentication path: the sibling at each level</text><rect x="58.5" y="119.5" width="17" height="17" rx="2" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="96" y="132" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">the WOTS+C leaf this signature uses</text><line x1="540" y1="190" x2="420" y2="268" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="540" y1="190" x2="660" y2="268" stroke="#777" stroke-width="1.2" stroke-linecap="round"/><line x1="420" y1="268" x2="300" y2="346" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="420" y1="268" x2="540" y2="346" stroke="#777" stroke-width="1.2" stroke-linecap="round"/><line x1="300" y1="346" x2="180" y2="424" stroke="#777" stroke-width="1.2" stroke-linecap="round"/><line x1="300" y1="346" x2="420" y2="424" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="180" y1="424" x2="120" y2="502" stroke="#777" stroke-width="1.2" stroke-linecap="round"/><line x1="180" y1="424" x2="240" y2="502" stroke="#777" stroke-width="1.2" stroke-linecap="round"/><circle cx="540" cy="190" r="15" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="540" y="194.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₀,₀</text><circle cx="420" cy="268" r="15" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="420" y="272.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₁,₀</text><rect x="647.0" y="255.0" width="26" height="26" rx="2" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="660" y="272.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₁,₁</text><text x="660" y="299" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 0</text><circle cx="300" cy="346" r="15" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="300" y="350.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₂,₀</text><rect x="527.0" y="333.0" width="26" height="26" rx="2" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="540" y="350.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₂,₁</text><text x="540" y="377" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 1</text><circle cx="180" cy="424" r="15" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="180" y="428.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₃,₀</text><rect x="407.0" y="411.0" width="26" height="26" rx="2" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="420" y="428.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₃,₁</text><text x="420" y="455" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 2</text><rect x="107.0" y="489.0" width="26" height="26" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="120" y="506.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₄,₀</text><text x="120" y="533" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 4</text><rect x="227.0" y="489.0" width="26" height="26" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="240" y="506.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₄,₁</text><text x="240" y="533" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 3</text><text x="540" y="168" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">root  =  sf_root  (in the public key)</text><text x="712" y="194.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">n₀,₀ = H(n₁,₀ ‖ n₁,₁)</text><text x="712" y="272.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">n₁,₀ = H(n₂,₀ ‖ n₂,₁)</text><text x="712" y="350.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">n₂,₀ = H(n₃,₀ ‖ n₃,₁)</text><text x="712" y="428.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">n₃,₀ = H(n₄,₀ ‖ n₄,₁)</text><text x="712" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">every leaf:  n = T_sf(WOTS+C public key)</text><text x="712" y="526" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="start" letter-spacing="0">every internal node:  H(left ‖ right)</text><rect x="30" y="566" width="470" height="208" rx="8" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="50" y="592" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Carried in the signature</text><text x="50" y="618" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">leaf_height = 252,  so  depth = 255 − 252 = 3</text><text x="50" y="645" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">leaf_index  = 1     (the leaf is a right child at its level)</text><text x="50" y="672" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">σ  = WOTS+C signature: 2 B counter ‖ 32 × 16 B chains</text><text x="50" y="699" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">auth = { n₃,₀ , n₂,₁ , n₁,₁ }   one sibling per level,</text><text x="50" y="726" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">            leaf upwards — exactly depth × 16 = 48 bytes</text><text x="50" y="758" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">total 1 + 16 + 1 + 514 + 48  =  580 bytes</text><rect x="520" y="566" width="470" height="208" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="540" y="592" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Root recomputation by the verifier</text><text x="540" y="618" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">node ← WOTS+C public key recovered from σ</text><text x="540" y="645" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#666" text-anchor="start" letter-spacing="0">bit 0 of leaf_index = 1 → node is the right child</text><text x="540" y="672" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">     node ← H( n₃,₀ ‖ node )</text><text x="540" y="699" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">bit 1 = 0 → left child:  node ← H( node ‖ n₂,₁ )</text><text x="540" y="726" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">bit 2 = 0 → left child:  node ← H( node ‖ n₁,₁ )</text><text x="540" y="758" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">the tree shape is never consulted, only depth</text><rect x="30" y="792" width="960" height="56" rx="8" fill="#e6e0f8" stroke="#7e57c2" stroke-width="1.3"/><text x="510" y="817" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Accept when the recomputed node equals sf_root; otherwise reject.</text><text x="510" y="836" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">One code path covers UXMSS, BXMSS and any other shape a signer chooses.</text></svg>