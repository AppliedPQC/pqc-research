<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1180" height="900" fill="#ffffff"/><text x="590" y="34" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">WOTS+, the one-time signature WOTS+C departs from</text><text x="590" y="56" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">drawn at w = 8, signing the digit D = 2 on one message chain</text><text x="60" y="104" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">1.  Key generation</text><text x="60" y="126" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#444" text-anchor="start" letter-spacing="0">Each chain starts at a secret and ends at a public value, w − 1 = 7 hashes along.</text><circle cx="120" cy="176" r="17" fill="#efefef" stroke="#8a8a8a" stroke-width="1.3"/><text x="120" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">0</text><line x1="137" y1="176" x2="221" y2="176" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><text x="179.0" y="162" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">H</text><circle cx="238" cy="176" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="238" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">1</text><line x1="255" y1="176" x2="339" y2="176" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="356" cy="176" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="356" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">2</text><line x1="373" y1="176" x2="457" y2="176" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="474" cy="176" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="474" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">3</text><line x1="491" y1="176" x2="575" y2="176" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="592" cy="176" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="592" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">4</text><line x1="609" y1="176" x2="693" y2="176" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="710" cy="176" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="710" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">5</text><line x1="727" y1="176" x2="811" y2="176" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="828" cy="176" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="828" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">6</text><line x1="845" y1="176" x2="929" y2="176" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="946" cy="176" r="17" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="946" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">7</text><text x="120" y="214" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">sₖ  secret</text><text x="946" y="214" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">pₖ = H⁷(sₖ)</text><text x="590" y="236" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">A verifier can walk forward by hashing. Walking back would mean inverting H.</text><text x="60" y="288" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">2.  Signing the digit D = 2</text><rect x="60" y="302" width="1060" height="34" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="80" y="324" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">message chain:   σ₀ = Hᴰ(s₀) = H²(s₀)</text><text x="600" y="324" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">checksum chain:   σ₁ = Hʷ⁻¹⁻ᴰ(s₁) = H⁵(s₁)</text><circle cx="120" cy="392" r="17" fill="#efefef" stroke="#8a8a8a" stroke-width="1.3"/><text x="120" y="396" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">0</text><line x1="137" y1="392" x2="221" y2="392" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="238" cy="392" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="238" y="396" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">1</text><line x1="255" y1="392" x2="339" y2="392" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="356" cy="392" r="17" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="356" y="396" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">2</text><line x1="373" y1="392" x2="457" y2="392" stroke="#ccc" stroke-width="1.0" stroke-linecap="round"/><circle cx="474" cy="392" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="474" y="396" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">3</text><line x1="491" y1="392" x2="575" y2="392" stroke="#ccc" stroke-width="1.0" stroke-linecap="round"/><circle cx="592" cy="392" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="592" y="396" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">4</text><line x1="609" y1="392" x2="693" y2="392" stroke="#ccc" stroke-width="1.0" stroke-linecap="round"/><circle cx="710" cy="392" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="710" y="396" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">5</text><line x1="727" y1="392" x2="811" y2="392" stroke="#ccc" stroke-width="1.0" stroke-linecap="round"/><circle cx="828" cy="392" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="828" y="396" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">6</text><line x1="845" y1="392" x2="929" y2="392" stroke="#ccc" stroke-width="1.0" stroke-linecap="round"/><circle cx="946" cy="392" r="17" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="946" y="396" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">7</text><text x="70" y="392" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="end" letter-spacing="0">chain 0</text><text x="356" y="424" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#b8860b" text-anchor="middle" letter-spacing="0">σ₀ published</text><circle cx="120" cy="486" r="17" fill="#efefef" stroke="#8a8a8a" stroke-width="1.3"/><text x="120" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">0</text><line x1="137" y1="486" x2="221" y2="486" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="238" cy="486" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="238" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">1</text><line x1="255" y1="486" x2="339" y2="486" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="356" cy="486" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="356" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">2</text><line x1="373" y1="486" x2="457" y2="486" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="474" cy="486" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="474" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">3</text><line x1="491" y1="486" x2="575" y2="486" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="592" cy="486" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="592" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">4</text><line x1="609" y1="486" x2="693" y2="486" stroke="#555" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar)"/><circle cx="710" cy="486" r="17" fill="#fce5cd" stroke="#e69138" stroke-width="1.3"/><text x="710" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">5</text><line x1="727" y1="486" x2="811" y2="486" stroke="#ccc" stroke-width="1.0" stroke-linecap="round"/><circle cx="828" cy="486" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="828" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">6</text><line x1="845" y1="486" x2="929" y2="486" stroke="#ccc" stroke-width="1.0" stroke-linecap="round"/><circle cx="946" cy="486" r="17" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="946" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">7</text><text x="70" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="end" letter-spacing="0">chain 1</text><text x="70" y="502" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" font-style="normal" fill="#666" text-anchor="end" letter-spacing="0">checksum</text><text x="710" y="518" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="bold" font-style="normal" fill="#e69138" text-anchor="middle" letter-spacing="0">σ₁ published</text><text x="60" y="572" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">3.  Verification</text><text x="60" y="594" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#444" text-anchor="start" letter-spacing="0">Finish each chain. Both ends must match the public key.</text><rect x="60" y="610" width="520" height="96" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="80" y="636" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">from σ₀, walk the remaining w − 1 − D = 5</text><text x="80" y="660" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">from σ₁, walk the remaining D = 2</text><text x="80" y="690" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">accept iff  H⁵(σ₀) = p₀  and  H²(σ₁) = p₁</text><rect x="600" y="610" width="520" height="96" rx="8" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="620" y="636" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Total work is 5 + 2 = 7 steps here, but it is</text><text x="620" y="660" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">the digit that decides the split, so a different</text><text x="620" y="690" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">message moves the work between the chains.</text><rect x="60" y="730" width="1060" height="148" rx="8" fill="#e6e0f8" stroke="#7e57c2" stroke-width="1.3"/><text x="80" y="758" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Why the checksum chain is there</text><text x="80" y="786" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Given σ₀ = H²(s₀), an adversary can hash it further and produce H³(s₀), H⁴(s₀), and so on. Without a second</text><text x="80" y="808" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">chain that is exactly a forgery: a valid signature on every digit larger than the one that was signed.</text><text x="80" y="836" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">The checksum chain moves the opposite way. Raising D lowers w − 1 − D, so forging a larger digit means</text><text x="80" y="858" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">walking the checksum chain backwards, which is inverting H.</text></svg>