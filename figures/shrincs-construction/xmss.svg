<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1180" height="980" fill="#ffffff"/><rect x="40" y="26" width="520" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="52" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">XMSS: signing with leaf i = 2 of a height-3 tree</text><rect x="40" y="78" width="520" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><line x1="60" y1="100" x2="100" y2="100" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><text x="112" y="104" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">signing path: the leaf up to the root</text><circle cx="80" cy="128" r="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="112" y="132" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">authentication path: the sibling at each level, carried in the signature</text><line x1="330" y1="286" x2="590" y2="196" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="850" y1="286" x2="590" y2="196" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="200" y1="376" x2="330" y2="286" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="460" y1="376" x2="330" y2="286" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="720" y1="376" x2="850" y2="286" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="980" y1="376" x2="850" y2="286" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="135" y1="486" x2="200" y2="376" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="265" y1="486" x2="200" y2="376" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="395" y1="486" x2="460" y2="376" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="525" y1="486" x2="460" y2="376" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="655" y1="486" x2="720" y2="376" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="785" y1="486" x2="720" y2="376" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="915" y1="486" x2="980" y2="376" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="1045" y1="486" x2="980" y2="376" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><circle cx="590" cy="196" r="19" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="590" y="200" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₀,₃</text><circle cx="330" cy="286" r="19" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="330" y="290" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₀,₂</text><circle cx="850" cy="286" r="19" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="850" y="290" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₁,₂</text><circle cx="200" cy="376" r="19" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="200" y="380" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₀,₁</text><circle cx="460" cy="376" r="19" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="460" y="380" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₁,₁</text><circle cx="720" cy="376" r="19" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="720" y="380" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₂,₁</text><circle cx="980" cy="376" r="19" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="980" y="380" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₃,₁</text><rect x="114.0" y="465.0" width="42" height="42" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="135" y="484" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₀,₀</text><text x="135" y="499" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">= H(pk₀)</text><rect x="244.0" y="465.0" width="42" height="42" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="265" y="484" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₁,₀</text><text x="265" y="499" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">= H(pk₁)</text><rect x="374.0" y="465.0" width="42" height="42" rx="2" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="395" y="484" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₂,₀</text><text x="395" y="499" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">= H(pk₂)</text><rect x="504.0" y="465.0" width="42" height="42" rx="2" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="525" y="484" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₃,₀</text><text x="525" y="499" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">= H(pk₃)</text><rect x="634.0" y="465.0" width="42" height="42" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="655" y="484" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₄,₀</text><text x="655" y="499" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">= H(pk₄)</text><rect x="764.0" y="465.0" width="42" height="42" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="785" y="484" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₅,₀</text><text x="785" y="499" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">= H(pk₅)</text><rect x="894.0" y="465.0" width="42" height="42" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="915" y="484" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₆,₀</text><text x="915" y="499" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">= H(pk₆)</text><rect x="1024.0" y="465.0" width="42" height="42" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="1045" y="484" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">v₇,₀</text><text x="1045" y="499" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">= H(pk₇)</text><text x="590" y="172" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">root = the public key</text><text x="700" y="200" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">v₀,₃ = H(v₀,₂ ‖ v₁,₂)</text><text x="60" y="290" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">v₀,₂ = H(v₀,₁ ‖ v₁,₁)</text><text x="960" y="290" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="start" letter-spacing="0">v₁,₂ = H(v₂,₁ ‖ v₃,₁)</text><text x="590" y="434" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle" letter-spacing="0">v₁,₁ = H(v₂,₀ ‖ v₃,₀)</text><text x="590" y="536" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#333" text-anchor="middle" letter-spacing="0">leaves:  vᵢ,₀ = H(pkᵢ), the hash of the i-th WOTS+ public key</text><rect x="40" y="572" width="520" height="208" rx="8" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="60" y="598" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">What the signature carries  (i = 2)</text><text x="60" y="626" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">σ₂   the one-time signature on the message,</text><text x="60" y="648" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">        made with the WOTS+ secret key sk₂</text><text x="60" y="678" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">auth₂ = { v₃,₀ , v₀,₁ , v₁,₂ }</text><text x="60" y="702" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">        one sibling per level, leaf upwards</text><text x="60" y="736" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#444" text-anchor="start" letter-spacing="0">The index i is carried too: it tells the verifier</text><text x="60" y="758" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#444" text-anchor="start" letter-spacing="0">which side to combine on at each level.</text><rect x="600" y="572" width="540" height="208" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="620" y="598" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">How the verifier rebuilds the root</text><text x="620" y="626" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">level 0 → 1   recover pk′₂ from σ₂, so v′₂,₀ = H(pk′₂),</text><text x="620" y="648" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">                     then v′₁,₁ = H(v′₂,₀ ‖ v₃,₀)</text><text x="620" y="678" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">level 1 → 2   v′₀,₂ = H(v₀,₁ ‖ v′₁,₁)</text><text x="620" y="708" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">level 2 → 3   v′₀,₃ = H(v′₀,₂ ‖ v₁,₂)</text><text x="620" y="744" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#444" text-anchor="start" letter-spacing="0">Bit k of i decides which side the sibling goes:</text><text x="620" y="766" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#444" text-anchor="start" letter-spacing="0">i = 2 is 010, so the node is the left, right then left child.</text><rect x="40" y="800" width="1100" height="56" rx="8" fill="#e6e0f8" stroke="#7e57c2" stroke-width="1.3"/><text x="590" y="824" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Accept when the recomputed v′₀,₃ equals the public root v₀,₃; otherwise reject.</text><text x="590" y="844" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">The one-time key is used once: signing twice under one leaf would break the WOTS+ signature beneath it.</text><rect x="40" y="876" width="1100" height="84" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="590" y="902" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Where this sits in SHRINCS</text><text x="590" y="926" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">The stateless fallback stacks five of these into a hypertree, each layer signing the root of the one below.</text><text x="590" y="948" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">The stateful path replaces the fixed shape with FXMSS, where the signer chooses the tree and the verifier never learns it.</text></svg>