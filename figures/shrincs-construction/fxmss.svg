<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1280" height="1080" fill="#ffffff"/><rect x="40" y="26" width="620" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="52" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">FXMSS: a Merkle tree whose shape the verifier never learns</text><rect x="40" y="78" width="900" height="34" rx="6" fill="#efefef" stroke="#8a8a8a" stroke-width="1.3"/><text x="60" y="100" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">The root sits at an imaginary height 255, so a leaf at depth d has height 255 − d, and d fits in one byte</text><circle cx="56" cy="140" r="11" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="56" y="144" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">1</text><text x="76" y="144" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Key generation</text><rect x="56" y="160" width="560" height="150" rx="8" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="76" y="186" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">The signer picks the shape, as two bytes in the secret key:</text><text x="76" y="212" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">sf_structure = (shape, depth)</text><text x="76" y="238" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">UXMSS, left-leaning: budget depth + 1, sizes rising</text><text x="76" y="260" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">BXMSS, balanced: budget 2^depth, every size equal</text><text x="76" y="290" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="start" letter-spacing="0">The root is sf_root, one of the two roots in the public key.</text><circle cx="680" cy="140" r="11" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="680" y="144" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">2</text><text x="700" y="144" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Signing</text><rect x="680" y="160" width="560" height="150" rx="8" fill="#e6e0f8" stroke="#7e57c2" stroke-width="1.3"/><text x="700" y="186" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">A state counter selects the leaf, and must never repeat:</text><text x="700" y="212" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">(leaf_index, leaf_height) = leaf_select(structure, ctr)</text><text x="700" y="240" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">the WOTS+C key at that leaf signs the digest</text><text x="700" y="262" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">one sibling per level is collected, leaf upwards</text><text x="700" y="290" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="start" letter-spacing="0">When no leaf is left, the stateless fallback signs instead.</text><text x="56" y="346" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">UXMSS at depth 4, signing with the counter at 2</text><rect x="40" y="358" width="600" height="30" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><line x1="58" y1="373" x2="92" y2="373" stroke="#cc0000" stroke-width="3.0" stroke-linecap="round"/><text x="102" y="377" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">signing path</text><circle cx="228" cy="373" r="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="242" y="377" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">authentication path</text><rect x="392.5" y="365.5" width="15" height="15" rx="2" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="414" y="377" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">the leaf this signature uses</text><line x1="470" y1="432" x2="362" y2="506" stroke="#cc0000" stroke-width="3.0" stroke-linecap="round"/><line x1="470" y1="432" x2="578" y2="506" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="362" y1="506" x2="254" y2="580" stroke="#cc0000" stroke-width="3.0" stroke-linecap="round"/><line x1="362" y1="506" x2="470" y2="580" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="254" y1="580" x2="146" y2="654" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="254" y1="580" x2="362" y2="654" stroke="#cc0000" stroke-width="3.0" stroke-linecap="round"/><line x1="146" y1="654" x2="92" y2="728" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><line x1="146" y1="654" x2="200" y2="728" stroke="#888" stroke-width="1.1" stroke-linecap="round"/><circle cx="470" cy="432" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="470" y="436" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₀,₀</text><circle cx="362" cy="506" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="362" y="510" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₁,₀</text><rect x="563.0" y="491.0" width="30" height="30" rx="2" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="578" y="510" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₁,₁</text><text x="578" y="536" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 0</text><circle cx="254" cy="580" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="254" y="584" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₂,₀</text><rect x="455.0" y="565.0" width="30" height="30" rx="2" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="470" y="584" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₂,₁</text><text x="470" y="610" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 1</text><circle cx="146" cy="654" r="17" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="146" y="658" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₃,₀</text><rect x="347.0" y="639.0" width="30" height="30" rx="2" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="362" y="658" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₃,₁</text><text x="362" y="684" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 2</text><rect x="77.0" y="713.0" width="30" height="30" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="92" y="732" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₄,₀</text><text x="92" y="758" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 4</text><rect x="185.0" y="713.0" width="30" height="30" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="200" y="732" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">n₄,₁</text><text x="200" y="758" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#666" text-anchor="middle" letter-spacing="0">ctr 3</text><text x="470" y="410" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">sf_root, at height 255</text><text x="700" y="436" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="start" letter-spacing="0">the signer walks down the left spine and hangs</text><text x="700" y="458" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="start" letter-spacing="0">one leaf to the right at each level; the last two</text><text x="700" y="480" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="start" letter-spacing="0">leaves sit side by side at the bottom.</text><rect x="680" y="512" width="560" height="250" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="700" y="538" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">This signature carries</text><text x="700" y="566" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">leaf_height = 252, so depth = 255 − 252 = 3</text><text x="700" y="590" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">leaf_index = 1, a right child at its level</text><text x="700" y="614" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">σ = 2 B counter ‖ 32 × 16 B WOTS+C chains</text><text x="700" y="638" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">auth = { n₃,₀ , n₂,₁ , n₁,₁ }, exactly depth × 16 B</text><text x="700" y="670" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">1 + 16 + 1 + 514 + 48  =  580 bytes</text><text x="700" y="702" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="start" letter-spacing="0">A deeper leaf costs 16 more bytes per level, so the</text><text x="700" y="724" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="start" letter-spacing="0">same key yields signatures from 548 up to 4,619 B</text><text x="700" y="746" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="start" letter-spacing="0">as it is used.</text><circle cx="56" cy="800" r="11" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="56" y="804" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">3</text><text x="76" y="804" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Verification</text><rect x="56" y="820" width="560" height="158" rx="8" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="76" y="846" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">1.  read the first byte, so depth = 255 − leaf_height</text><text x="76" y="870" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">2.  reject unless auth is exactly depth × 16 bytes</text><text x="76" y="894" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">3.  recover the leaf from the WOTS+C signature</text><text x="76" y="918" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">4.  climb depth levels; bit k of leaf_index says which</text><text x="76" y="940" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">      side the sibling goes on</text><text x="76" y="968" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">accept iff the climb ends at sf_root</text><rect x="680" y="820" width="560" height="158" rx="8" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="700" y="846" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Nothing above reads the shape</text><text x="700" y="874" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">The verifier is given a depth and an index, not a tree.</text><text x="700" y="896" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">UXMSS, BXMSS or anything else a signer builds runs</text><text x="700" y="918" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">through the same code, which bounds what consensus</text><text x="700" y="940" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">has to review and optimise.</text><text x="700" y="968" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">The shape binds into key derivation instead.</text><rect x="40" y="996" width="1200" height="68" rx="8" fill="#e6e0f8" stroke="#7e57c2" stroke-width="1.3"/><text x="640" y="1022" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Where the shape does matter: PRF sees the full 22-byte address, structure bytes included.</text><text x="640" y="1046" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">One seed under two shapes gives disjoint secrets, so importing a key with the wrong shape byte yields an unusable key, not a collision.</text></svg>