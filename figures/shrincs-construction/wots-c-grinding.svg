<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1060" height="560" fill="#ffffff"/><text x="530" y="34" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Constant-sum grinding</text><text x="530" y="56" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">the signer searches a 16-bit counter until the 32 chain indexes sum to 240</text><rect x="40" y="110" width="190" height="74" rx="6" fill="#efefef" stroke="#8a8a8a" stroke-width="1.3"/><text x="135.0" y="144.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">message_digest</text><text x="135.0" y="161.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">32 B, from H_msg_sf</text><rect x="40" y="110" width="190" height="74" rx="6" fill="#efefef" stroke="#8a8a8a" stroke-width="1.3"/><text x="135.0" y="144.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">message_digest</text><text x="135.0" y="161.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">32 B, from H_msg_sf</text><rect x="40" y="216" width="190" height="58" rx="6" fill="#fce5cd" stroke="#e69138" stroke-width="1.3"/><text x="135.0" y="242.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">counter i</text><text x="135.0" y="259.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">2 B, starts at 0</text><path d="M 230 147.0 L 268 147.0" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/><path d="M 230 245 C 250 245 250 147.0 268 147.0" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/><rect x="270" y="110" width="250" height="74" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="395.0" y="144.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">H_grind</text><text x="395.0" y="161.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">pk_seed ‖ 0⁴⁸ ‖ ADRS[:10] ‖ digest ‖ 0⁴ ‖ i</text><path d="M 520 147.0 L 558 147.0" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/><rect x="560" y="110" width="200" height="74" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="660.0" y="144.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">base_2b(·, 4, 32)</text><text x="660.0" y="161.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#4a4a4a" text-anchor="middle" letter-spacing="0">32 indexes d₀…d₃₁, 4 bits each</text><path d="M 760 147.0 L 798 147.0" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#ar)"/><rect x="800" y="110" width="220" height="74" rx="6" fill="#fff2cc" stroke="#d6a800" stroke-width="1.3"/><text x="910" y="140" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">Σ dᵢ = 240 ?</text><text x="910" y="162" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#555" text-anchor="middle" letter-spacing="0">WOTS_C_CONSTANT_SUM</text><path d="M 910 184 L 910 322 L 135 322 L 135 274" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="520" y="340" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#cc0000" text-anchor="middle" letter-spacing="0">no  —  i ← i + 1, try again</text><path d="M 1020 147.0 L 1040 147.0 L 1040 400 L 700 400" fill="none" stroke="#38761d" stroke-width="1.6" marker-end="url(#ar)"/><rect x="300" y="376" width="396" height="48" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="498.0" y="404.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">signature = i (2 B) ‖ 32 × 16 B chain values</text><text x="760" y="392" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#38761d" text-anchor="middle" letter-spacing="0">yes</text><rect x="40" y="448" width="470" height="96" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="474" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">How long the search takes</text><text x="60" y="498" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">P(Σ = 240) ≈ 0.0153, so about 64 counters on average.</text><text x="60" y="520" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Measured over 300 messages: mean 64.4, worst 354.</text><text x="60" y="540" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">All 2¹⁶ counters failing has probability below 2⁻¹⁴⁵⁰.</text><rect x="530" y="448" width="490" height="96" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="550" y="474" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Why H_grind reads only ADRS[:10]</text><text x="550" y="498" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">pk_seed ‖ 0⁴⁸ fills one SHA-256 block, which is cached.</text><text x="550" y="520" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">The remaining 10 + 32 + 4 + 2 = 48 bytes then fit inside</text><text x="550" y="540" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">a single further compression — the cost that runs 2¹⁶ times.</text></svg>