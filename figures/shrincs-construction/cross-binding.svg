<text x="868.2352941176471" y="443.0" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle" letter-spacing="0">message</text><path d="M 759.8913043478261 356 C 759.8913043478261 300 652.9411764705883 290 612.9411764705883 236" fill="none" stroke="#cc0000" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ar)"/><path d="M 640.0900900900901 126 L 640.0900900900901 100 L 1044 100 L 1044 486 L 612.9411764705883 486 L 612.9411764705883 466" fill="none" stroke="#cc0000" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="72" y="74" width="16" height="14" rx="3" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="96" y="300" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#cc0000" text-anchor="start" letter-spacing="0">sl_root, the stateless root, also sits inside the stateful message</text><text x="96" y="322" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#cc0000" text-anchor="start" letter-spacing="0">sf_root, the stateful root, also sits inside the stateless message</text><rect x="60" y="506" width="960" height="112" rx="8" fill="#e6e0f8" stroke="#7e57c2" stroke-width="1.3"/><text x="80" y="532" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">The two components are interlocked.</text><text x="80" y="556" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Neither root can be lifted out of the 48-byte public key and used as a key in its own right, and a signature</text><text x="80" y="578" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">made on one path cannot be replayed under a different public key. The stateless signer reaches this by</text><text x="80" y="600" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start" letter-spacing="0">handing SLH-DSA  sf_root ‖ message  to sign rather than the message alone.</text></svg>