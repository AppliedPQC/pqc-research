<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="820" viewBox="0 0 1180 820"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1180" height="820" fill="#ffffff"/><rect x="40" y="26" width="550" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="52" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">A VOLE-in-the-head proof, in the order it is built</text><rect x="40" y="84" width="560" height="44" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="320" y="112" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Prover (in a signature: the signer)</text><rect x="640" y="84" width="500" height="44" rx="6" fill="#e6e0f8" stroke="#8e7cc3" stroke-width="1.3"/><text x="890" y="112" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Challenge = hash of everything so far</text><rect x="40" y="150" width="560" height="64" rx="6" fill="#ffffff" stroke="#6aa84f" stroke-width="1.3"/><text x="60" y="177" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">1. Commit to τ trees of seeds; send the corrections</text><text x="78" y="199" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">that align every tree on one u</text><line x1="602" y1="182" x2="638" y2="262" stroke="#888888" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640" y="230" width="500" height="64" rx="6" fill="#ffffff" stroke="#8e7cc3" stroke-width="1.3"/><text x="660" y="257" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">2. Challenge 1</text><text x="678" y="279" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">picks a universal hash H</text><line x1="638" y1="262" x2="602" y2="342" stroke="#888888" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="40" y="310" width="560" height="64" rx="6" fill="#ffffff" stroke="#6aa84f" stroke-width="1.3"/><text x="60" y="337" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">3. Send Hu, HV (consistency check)</text><text x="78" y="359" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">and the masked witness d = u + w</text><line x1="602" y1="342" x2="638" y2="422" stroke="#888888" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640" y="390" width="500" height="64" rx="6" fill="#ffffff" stroke="#8e7cc3" stroke-width="1.3"/><text x="660" y="417" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">4. Challenge 2</text><text x="678" y="439" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">random combination of all the constraints</text><line x1="638" y1="422" x2="602" y2="502" stroke="#888888" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="40" y="470" width="560" height="64" rx="6" fill="#ffffff" stroke="#6aa84f" stroke-width="1.3"/><text x="60" y="497" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">5. Send the QuickSilver coefficients</text><text x="78" y="519" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">masked, so they reveal nothing about w</text><line x1="602" y1="502" x2="638" y2="582" stroke="#888888" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="640" y="550" width="500" height="64" rx="6" fill="#ffffff" stroke="#cc0000" stroke-width="2"/><text x="660" y="577" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#cc0000" text-anchor="start">6. Challenge 3 = Δ = (j*₁, …, j*_τ)</text><text x="678" y="599" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">one hidden index per tree</text><line x1="638" y1="582" x2="602" y2="662" stroke="#888888" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="40" y="630" width="560" height="64" rx="6" fill="#ffffff" stroke="#6aa84f" stroke-width="1.3"/><text x="60" y="657" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">7. Open every seed except j*ₜ in each tree</text><text x="78" y="679" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">about k nodes per tree</text><rect x="40" y="720" width="520" height="76" rx="6" fill="#f4cccc" stroke="#cc0000" stroke-width="1.3"/><text x="60" y="748" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Δ comes last</text><text x="60" y="772" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">a prover who knew Δ could open its commitments to anything</text><rect x="580" y="720" width="560" height="76" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="600" y="748" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Verifier</text><text x="600" y="772" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">rebuilds q from the opened seeds and repeats every check</text></svg>