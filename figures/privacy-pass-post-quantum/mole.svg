ne</text><text x="855" y="232" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">of P₁ … P_N", not which;</text><text x="855" y="256" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">issues a credential</text><line x1="522" y1="190" x2="738" y2="190" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><text x="630" y="180" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">redeem: 6.5 KB</text><line x1="738" y1="244" x2="522" y2="244" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><text x="630" y="236" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">credential: 5.4 KB</text><rect x="1030" y="160" width="110" height="110" rx="6" fill="#f3f3f3" stroke="#999999" stroke-width="1.3"/><text x="1085" y="210" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Site</text><text x="1085" y="232" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">interactions</text><line x1="972" y1="215" x2="1028" y2="215" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="310" y="320" width="830" height="100" rx="6" fill="#ffffff" stroke="#3d85c6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="330" y="350" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Each spend of the credential (VOLE-ACT, 12.0 KB)</text><text x="330" y="378" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">proves the hidden balance is in range and gets back a credential with the new balance;</text><text x="330" y="397.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">the moderator never learns the balance. Spent tokens are tracked by the caller through nullifiers.</text><rect x="40" y="456" width="1100" height="230" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555" text-anchor="start">Scheme</text><text x="260" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555" text-anchor="start">Role</text><text x="640" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555" text-anchor="start">Issuance</text><text x="900" y="490" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#555555" text-anchor="start">Presentation</text><line x1="60" y1="504" x2="1120" y2="504" stroke="#d9d9d9" stroke-width="1.2" stroke-linecap="round"/><text x="60" y="540" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">PoMFRIT</text><text x="260" y="540" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">blind signature</text><text x="640" y="540" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">&lt; 1 KB</text><text x="900" y="540" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">4.3 KB</text><text x="60" y="582" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">VOLE-IHAT</text><text x="260" y="582" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">endorsement, issuer hidden</text><text x="640" y="582" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">5.6 KB</text><text x="900" y="582" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">6.5 KB</text><text x="60" y="624" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">VOLE-ACT</text><text x="260" y="624" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">credential with a balance</text><text x="640" y="624" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">5.4 KB</text><text x="900" y="624" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">12.0 KB</text><text x="60" y="668" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#555555" text-anchor="start">All at FAEST-EM-128s parameters with uov-Ip; every step a few milliseconds.</text></svg>