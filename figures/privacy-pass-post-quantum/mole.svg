<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1180" height="720" fill="#ffffff"/><rect x="40" y="26" width="662.2" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="52" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">MOLE: endorsements from anchors, credentials from a moderator</text><rect x="40" y="100" width="150" height="48" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="115" y="130" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Anchor 1</text><rect x="40" y="162" width="150" height="48" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="115" y="192" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Anchor 2</text><rect x="40" y="224" width="150" height="48" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="115" y="254" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Anchor …</text><rect x="40" y="286" width="150" height="48" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="115" y="316" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Anchor N</text><text x="115" y="370" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="nor