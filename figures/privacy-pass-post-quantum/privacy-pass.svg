<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1180" height="650" fill="#ffffff"/><rect x="40" y="26" width="774.4" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="52" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Privacy Pass today: what a quantum computer breaks, and what it does not</text><rect x="40" y="96" width="300" height="66" rx="6" fill="#f3f3f3" stroke="#999999" stroke-width="1.3"/><text x="190" y="124" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Issuer</text><text x="190" y="148" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">signs tokens after a check</text><rect x="440" y="96" width="300" height="66" rx="6" fill="#f3f3f3" stroke="#999999" stroke-width="1.3"/><text x="590" y="124" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Client</text><text x="590" y="148" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">browser or app</text><rect x="840" y="96" width="300" height="66" rx="6" fill="#f3f3f3" stroke="#999999" stroke-width="1.3"/><text x="990" y="124" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Origin</text><text x="990" y="148" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">the site that redeems</text><text x="240" y="196" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#555555" text-anchor="middle">issuance</text><line x1="440" y1="214" x2="342" y2="214" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><text x="391" y="236" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">blinded value</text><line x1="342" y1="262" x2="440" y2="262" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><text x="391" y="284" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">signature on it</text><text x="940" y="196" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#555555" text-anchor="middle">redemption</text><line x1="742" y1="238" x2="840" y2="238" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><text x="791" y="230" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">token +</text><text x="791" y="258" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">signature</text><rect x="860" y="214" width="280" height="64" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 3"/><text x="876" y="238" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">verifies with the issuer's</text><text x="876" y="257.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">RSA public key</text><rect x="40" y="312" width="540" height="160" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="60" y="342" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Holds: unlinkability</text><text x="60" y="372" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">The issuer only ever saw a blinded value, and an RSA</text><text x="60" y="392.15" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">blind signature hides it unconditionally: no amount of</text><text x="60" y="412.3" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">computation links a redemption to its issuance.</text><text x="60" y="432.45" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Tokens issued today stay private after Q-day.</text><rect x="600" y="312" width="540" height="160" rx="6" fill="#f4cccc" stroke="#cc0000" stroke-width="1.3"/><text x="620" y="342" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Falls to Shor's algorithm: unforgeability</text><text x="620" y="372" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">Factor the issuer's RSA modulus and the private key</text><text x="620" y="392.15" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">follows. An attacker then mints as many valid tokens</text><text x="620" y="412.3" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">as it likes, and the rate limit they enforce is gone.</text><text x="620" y="432.45" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Forgery, not privacy, is what has to be fixed.</text><rect x="40" y="492" width="1100" height="130" rx="6" fill="#e6e0f8" stroke="#8e7cc3" stroke-width="1.3"/><text x="60" y="522" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">The post-quantum replacement keeps the shape and swaps the parts</text><text x="60" y="552" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">the issuer's RSA signature  →  a UOV signature, 135 bytes</text><text x="60" y="572.15" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">unblinding the signature  →  a zero-knowledge proof that the client holds a valid one (VOLE-in-the-head)</text><text x="60" y="592.3" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">the token the origin sees  →  the proof, 4.3 KB for PoMFRIT</text></svg>