<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1180" height="860" fill="#ffffff"/><rect x="40" y="26" width="774.4" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="52" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">VOLE-in-the-head: the prover builds the VOLE alone, from a tree of seeds</text><rect x="40" y="80" width="620" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><line x1="60" y1="104" x2="100" y2="104" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><text x="112" y="108" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">path to the hidden seed j* = 5: never opened</text><circle cx="80" cy="132" r="9" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="112" y="136" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">opened: the sibling at each level, k = 3 nodes for N = 8 seeds</text><line x1="590" y1="200" x2="330" y2="290" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="590" y1="200" x2="850" y2="290" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="330" y1="290" x2="200" y2="380" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="330" y1="290" x2="460" y2="380" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="850" y1="290" x2="720" y2="380" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="850" y1="290" x2="980" y2="380" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="200" y1="380" x2="135" y2="464" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="200" y1="380" x2="265" y2="464" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="460" y1="380" x2="395" y2="464" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="460" y1="380" x2="525" y2="464" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="720" y1="380" x2="655" y2="464" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="720" y1="380" x2="785" y2="464" stroke="#cc0000" stroke-width="3.2" stroke-linecap="round"/><line x1="980" y1="380" x2="915" y2="464" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><line x1="980" y1="380" x2="1045" y2="464" stroke="#888888" stroke-width="1.1" stroke-linecap="round"/><circle cx="590" cy="200" r="24" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="590" y="205" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">seed</text><circle cx="330" cy="290" r="24" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="330" y="295" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">node</text><circle cx="850" cy="290" r="24" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="850" y="295" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">node</text><circle cx="200" cy="380" r="24" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="200" y="385" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">node</text><circle cx="460" cy="380" r="24" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="460" y="385" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">node</text><circle cx="720" cy="380" r="24" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="720" y="385" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">node</text><circle cx="980" cy="380" r="24" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="980" y="385" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">node</text><rect x="95" y="464" width="80" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="135" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">sd₀</text><text x="135" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">r₀</text><rect x="225" y="464" width="80" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="265" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">sd₁</text><text x="265" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">r₁</text><rect x="355" y="464" width="80" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="395" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">sd₂</text><text x="395" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">r₂</text><rect x="485" y="464" width="80" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="525" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">sd₃</text><text x="525" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">r₃</text><rect x="615" y="464" width="80" height="52" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="655" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">sd₄</text><text x="655" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">r₄</text><rect x="745" y="464" width="80" height="52" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="785" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">sd₅</text><text x="785" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">r₅</text><rect x="875" y="464" width="80" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="915" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">sd₆</text><text x="915" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">r₆</text><rect x="1005" y="464" width="80" height="52" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="1045" y="486" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">sd₇</text><text x="1045" y="506" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#555555" text-anchor="middle">r₇</text><text x="590" y="548" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">each seed sdᵢ is expanded by a PRG to a string rᵢ; the verifier can rebuild every rᵢ except r₅</text><rect x="40" y="580" width="540" height="150" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="60" y="610" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Prover, knowing every seed</text><text x="60" y="646" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">u = Σᵢ rᵢ</text><text x="260" y="646" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">v = Σᵢ i · rᵢ</text><text x="60" y="680" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">computed in F_{2^k}, with N = 2^k seeds</text><text x="60" y="699.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">and the index i read as a field element</text><rect x="600" y="580" width="540" height="150" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="620" y="610" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Verifier, missing only seed j*</text><text x="620" y="646" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">q = Σᵢ (j* − i) · rᵢ = j*·u − v</text><text x="620" y="680" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">the i = j* term is multiplied by zero, so r₅ is</text><text x="620" y="699.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">never needed: a valid VOLE with Δ = j*</text><rect x="40" y="750" width="1100" height="84" rx="6" fill="#e6e0f8" stroke="#8e7cc3" stroke-width="1.3"/><text x="60" y="780" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">One tree gives a k-bit Δ. Running τ trees and joining them gives a λ-bit Δ.</text><text x="60" y="806" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">The prover sends corrections so that every tree commits to the same u, and a universal-hash check catches wrong ones.</text></svg>