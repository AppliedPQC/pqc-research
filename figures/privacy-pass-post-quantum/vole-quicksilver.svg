<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1180" height="760" fill="#ffffff"/><rect x="40" y="26" width="794.8" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="52" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">A VOLE correlation is a commitment, and QuickSilver checks equations on it</text><rect x="40" y="90" width="330" height="150" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="60" y="120" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Prover holds</text><text x="60" y="150" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">uᵢ ∈ F₂        a random bit</text><text x="60" y="170.925" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">vᵢ ∈ F_{2^λ}   a random mask</text><text x="60" y="214" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#555555" text-anchor="start">never learns Δ until the end</text><rect x="810" y="90" width="330" height="150" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="830" y="120" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Verifier holds</text><text x="830" y="150" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">Δ ∈ F_{2^λ}   one global key</text><text x="830" y="170.925" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">qᵢ = uᵢ·Δ + vᵢ</text><text x="830" y="214" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="italic" fill="#555555" text-anchor="start">cannot see uᵢ: vᵢ masks it</text><rect x="400" y="110" width="380" height="110" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="590" y="140" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">qᵢ = uᵢ · Δ + vᵢ</text><text x="590" y="170" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">hiding: vᵢ is random</text><text x="590" y="192" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="middle">binding: changing uᵢ means guessing Δ</text><line x1="370" y1="165" x2="398" y2="165" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><line x1="810" y1="165" x2="782" y2="165" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><rect x="40" y="262" width="1100" height="64" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="290" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Commit to the witness w:</text><text x="282" y="290" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">the prover sends d = u + w, and the verifier updates qᵢ ← qᵢ + dᵢ·Δ = vᵢ + wᵢ·Δ</text><text x="282" y="312" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#555555" text-anchor="start">Sums of commitments are commitments to the sums, with no messages: linear steps are free.</text><line x1="80" y1="680" x2="550" y2="680" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/><line x1="80" y1="380" x2="80" y2="680" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round"/><text x="550" y="702" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#1a1a1a" text-anchor="end">X</text><line x1="400" y1="386" x2="400" y2="680" stroke="#cc0000" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><text x="400" y="702" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#cc0000" text-anchor="middle">Δ (secret)</text><line x1="80" y1="670" x2="530" y2="467.5" stroke="#6aa84f" stroke-width="2.2" stroke-linecap="round"/><circle cx="400" cy="526" r="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/><text x="530" y="495.5" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="end">ρ₁(X) = w₁X + v₁</text><text x="388" y="516" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#3d85c6" text-anchor="end">q₁ = ρ₁(Δ)</text><line x1="80" y1="465" x2="530" y2="438" stroke="#6aa84f" stroke-width="2.2" stroke-linecap="round"/><circle cx="400" cy="445.8" r="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.6"/><text x="530" y="424" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="end">ρ₂(X) = w₂X + v₂</text><text x="388" y="435.8" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#3d85c6" text-anchor="end">q₂ = ρ₂(Δ)</text><text x="80" y="366" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">the prover knows each whole line; the verifier knows one point on it</text><rect x="600" y="360" width="540" height="260" rx="6" fill="#e6e0f8" stroke="#8e7cc3" stroke-width="1.3"/><text x="620" y="390" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">QuickSilver: proving f(w) = 0</text><text x="620" y="422" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">1. Multiply lines to evaluate f: the prover gets a</text><text x="620" y="442.15" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">   polynomial in X, the verifier its value at Δ.</text><text x="620" y="462.3" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">2. The top coefficient of that polynomial is f(w).</text><text x="620" y="482.45" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">   If the constraint holds, it is zero.</text><text x="620" y="502.6" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">3. Fold all constraints into one with a random</text><text x="620" y="522.75" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">   combination; send the lower coefficients,</text><text x="620" y="542.9" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">   masked by spare VOLEs.</text><text x="620" y="563.05" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">4. The verifier checks they give its value at Δ.</text><text x="620" y="598" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">cheating passes with probability ≤ d / 2^λ; for UOV, d = 2</text><text x="80" y="728" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" font-style="italic" fill="#555555" text-anchor="start">Lines drawn over the reals for illustration; the arithmetic is in F_{2^λ}.</text></svg>