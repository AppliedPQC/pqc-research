<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="676" viewBox="0 0 1180 676"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/></marker></defs><rect width="1180" height="676" fill="#ffffff"/><rect x="40" y="26" width="733.6" height="40" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="60" y="52" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">PoMFRIT: a blind signature from a UOV signature and a proof about it</text><rect x="40" y="90" width="300" height="44" rx="6" fill="#f3f3f3" stroke="#999999" stroke-width="1.3"/><text x="190" y="118" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Client</text><line x1="190" y1="134" x2="190" y2="520" stroke="#d0d0d0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="440" y="90" width="300" height="44" rx="6" fill="#f3f3f3" stroke="#999999" stroke-width="1.3"/><text x="590" y="118" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Issuer</text><line x1="590" y1="134" x2="590" y2="520" stroke="#d0d0d0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="840" y="90" width="300" height="44" rx="6" fill="#f3f3f3" stroke="#999999" stroke-width="1.3"/><text x="990" y="118" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Verifier</text><line x1="990" y1="134" x2="990" y2="520" stroke="#d0d0d0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="40" y="156" width="300" height="70" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="56" y="182" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">choose the token message m</text><text x="56" y="201.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">and a random r; commit c = H(m, r)</text><line x1="342" y1="200" x2="438" y2="200" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><text x="390" y="192" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">c</text><rect x="440" y="240" width="300" height="70" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="456" y="266" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">s = UOV.Sign(sk, c)</text><text x="456" y="285.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">a 135-byte signature on c</text><line x1="438" y1="286" x2="342" y2="286" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><text x="390" y="278" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">s</text><text x="388" y="314" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" font-style="italic" fill="#555555" text-anchor="middle">issuance &lt; 1 KB</text><rect x="40" y="330" width="300" height="100" rx="6" fill="#d9ead3" stroke="#6aa84f" stroke-width="1.3"/><text x="56" y="356" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">prove in zero knowledge:</text><text x="56" y="375.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">"I know s and r with</text><text x="56" y="394.75" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">P(s) = H(m, r)"</text><line x1="342" y1="400" x2="838" y2="400" stroke="#555555" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar)"/><text x="590" y="392" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">m and the proof π: 4.3 KB</text><rect x="840" y="420" width="300" height="92" rx="6" fill="#cfe2f3" stroke="#3d85c6" stroke-width="1.3"/><text x="856" y="446" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">check π against P</text><text x="856" y="465.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">the issuer's 46.6 KB public key,</text><text x="856" y="484.75" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">fetched once and cached</text><rect x="40" y="546" width="540" height="104" rx="6" fill="#e6e0f8" stroke="#8e7cc3" stroke-width="1.3"/><text x="60" y="576" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">Why the two ends cannot be linked</text><text x="60" y="604" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">The issuer saw only c. The verifier sees m and π,</text><text x="60" y="623.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">and π is zero-knowledge: it never contains c, s or r.</text><rect x="600" y="546" width="540" height="104" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="620" y="576" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="start">The optimisation</text><text x="620" y="604" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">The client masks the hash and the issuer finds a UOV</text><text x="620" y="623.375" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">preimage directly: one fewer hash inside the proof,</text><text x="620" y="642.75" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">resting on a new one-more-UOV assumption.</text></svg>